[package]
name = "ziit"
version = "1.3.1"
edition = "2024"
license = "AGPL-3.0"
build = "build.rs"

[dependencies]
topcoat = { version = "0.12.1", default-features = false, features = [
  "compression",
  "asset",
  "cookie",
  "discover",
  "fs",
  "metadata",
  "multipart",
  "router",
  "runtime",
  "serve",
  "sitemap",
  "sse",
  "view",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = { version = "1.0.1", features = ["serde", "tzdb-bundle-always"] }
uuid = { version = "1.29.3", features = ["v4"] }
bcrypt = "0.19.3"
pasetors = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
futures = "0.3.34"
regex = "1.13.2"
sha2 = "0.11.1"
subtle = "2.6.1"
base64 = "0.23.1"
cuid2 = "0.1.6"
urlencoding = "2.1.3"
dotenvy = "0.15.7"
log = "0.4.35"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.2"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"

[build-dependencies]
oxc_allocator = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
oxc_semantic = "0.159.0"
oxc_transformer = "0.159.0"
oxc_codegen = "0.159.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
