name: Release

permissions:
  contents: read
  actions: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
      base:
        description: Previous tag or ref to compare from (defaults to the previous tag)
        required: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.version.outputs.full }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag '$TAG' is not vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi
          FULL="${TAG#v}"
          PRERELEASE=false
          if [[ "$FULL" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "releasing $FULL (prerelease: $PRERELEASE)"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Stamp release version into Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^version = ".*"$/s//version = "${{ needs.version.outputs.full }}"/' Cargo.toml
          grep -n -m 1 '^version = ' Cargo.toml

      - name: Image name
        id: image
        run: |
          name="${REGISTRY}/${{ github.repository }}"
          echo "name=$(echo "$name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    name: Publish image
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          name="${REGISTRY}/${{ github.repository }}"
          name="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
          tags=(-t "${name}:${TAG}")
          if [[ "$PRERELEASE" != "true" ]]; then
            tags+=(-t "${name}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf "${name}@sha256:%s " *)

  release:
    name: Release
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Changelog
        id: changelog
        uses: 0PandaDEV/changelog@main
        with:
          head: ${{ env.TAG }}
          base: ${{ github.event.inputs.base }}
          step-summary: "true"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.changelog.outputs.markdown }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "${flags[@]}"
          fi
